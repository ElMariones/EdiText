<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="EdiText — a minimalist plain-text editor for .txt files, with a one-liner converter."
    />
    <meta name="theme-color" id="theme-color" content="#F7F3EA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EdiText</title>
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem("editext.theme");
          if (t !== "dark" && t !== "light") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          d.dataset.theme = t;
          var a = { style: "basic", tone: "cream" };
          var raw = localStorage.getItem("editext.aspect.v1");
          if (raw) {
            var p = JSON.parse(raw);
            if (p && typeof p.style === "string") a.style = p.style;
            if (p && typeof p.tone === "string") a.tone = p.tone;
          }
          if (a.style !== "basic") d.dataset.style = a.style;
          if (a.tone !== "cream") d.dataset.tone = a.tone;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Soft ambient washes that give the glass surfaces something to blur -->
    <div class="ambient" aria-hidden="true">
      <div class="ambient-blob ambient-a"></div>
      <div class="ambient-blob ambient-b"></div>
      <div class="ambient-blob ambient-c"></div>
    </div>

    <div class="shell app">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="30" height="30">
              <defs>
                <linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#F3B269" />
                  <stop offset="1" stop-color="#D98A3D" />
                </linearGradient>
              </defs>
              <rect width="32" height="32" rx="8.5" fill="url(#brand-g)" />
              <g transform="translate(4 4)" stroke="#FFFDF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
                <path d="m15 5 4 4" />
              </g>
            </svg>
          </span>
          <div class="brand-text">
            <h1>EdiText</h1>
          </div>
        </div>

        <nav class="toolbar" aria-label="Editor actions">
          <button
            type="button"
            class="tool sidebar-toggle"
            id="sidebar-toggle"
            title="Toggle documents"
            aria-label="Toggle documents"
          >
            <span class="ic" data-icon="docs"></span>
          </button>
          <button type="button" class="tool" id="new-btn" title="New document (⌘N)" aria-label="New document">
            <span class="ic" data-icon="plus"></span>
          </button>
          <button type="button" class="tool" id="open-btn" title="Open a .txt file" aria-label="Open a .txt file">
            <span class="ic" data-icon="folder"></span>
          </button>
          <button type="button" class="tool" id="save-btn" title="Save as .txt (⌘S)" aria-label="Save as .txt file">
            <span class="ic" data-icon="download"></span>
          </button>

          <span class="toolbar-sep" role="presentation"></span>

          <button type="button" class="tool" id="copy-btn" title="Copy all text" aria-label="Copy all text">
            <span class="ic" data-icon="copy"></span>
          </button>
          <button type="button" class="tool" id="clear-btn" title="Clear editor" aria-label="Clear the editor">
            <span class="ic" data-icon="trash"></span>
          </button>
          <button type="button" class="tool" id="theme-btn" title="Switch to dark mode" aria-label="Switch to dark mode">
            <span class="ic" data-icon="moon"></span>
          </button>
          <button type="button" class="tool" id="aspect-btn" title="Aspect" aria-label="Choose aspect" aria-haspopup="true" aria-expanded="false">
            <span class="ic" data-icon="palette"></span>
          </button>
        </nav>

        <div class="aspect-menu glass" id="aspect-menu" hidden>
          <div class="aspect-group aspect-group-tones">
            <span class="aspect-label">Tone</span>
            <div class="aspect-options" id="tone-options">
              <button type="button" class="aspect-option" data-tone="cream">Cream</button>
              <button type="button" class="aspect-option" data-tone="blue">Blue</button>
              <button type="button" class="aspect-option" data-tone="green">Green</button>
              <button type="button" class="aspect-option" data-tone="red">Red</button>
              <button type="button" class="aspect-option" data-tone="white">White</button>
            </div>
          </div>
          <div class="aspect-group">
            <span class="aspect-label">Style</span>
            <div class="aspect-options aspect-options-styles" id="style-options">
              <button type="button" class="aspect-option" data-style-opt="basic">Basic</button>
              <button type="button" class="aspect-option" data-style-opt="cyberpunk">Cyberpunk</button>
              <button type="button" class="aspect-option" data-style-opt="win98">Windows 98</button>
              <button type="button" class="aspect-option" data-style-opt="paper">Paper</button>
              <button type="button" class="aspect-option" data-style-opt="console">Console</button>
            </div>
          </div>
        </div>
      </header>

      <div class="body">
        <aside class="sidebar glass" id="sidebar" aria-label="Documents">
          <div class="sidebar-head">
            <button
              type="button"
              class="tool col-toggle"
              id="sidebar-col-toggle"
              title="Collapse documents"
              aria-label="Collapse documents"
            >
              <span class="ic" data-icon="chevronsLeft"></span>
            </button>
            <span class="sidebar-title">Documents</span>
            <button
              type="button"
              class="tool sidebar-new"
              id="new-doc-btn"
              title="New document (⌘N)"
              aria-label="New document"
            >
              <span class="ic" data-icon="plus"></span>
            </button>
          </div>
          <ul class="doc-list" id="doc-list" role="listbox" aria-label="Documents"></ul>
        </aside>

        <div class="main-area">
          <main class="editor-card glass" id="editor-card">
            <label class="visually-hidden" for="editor">Plain text document</label>
            <textarea
              id="editor"
              placeholder="Start typing…"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="sentences"
              spellcheck="true"
            ></textarea>

            <footer class="statusbar">
              <span class="status-file" id="file-name" hidden></span>
              <span class="status-stats" id="stats">
                <span id="stat-lines">0 lines</span>
                <span class="dot-sep">·</span>
                <span id="stat-words">0 words</span>
                <span class="dot-sep">·</span>
                <span id="stat-chars">0 characters</span>
              </span>
              <span class="status-save" id="save-status" role="status" aria-live="polite">
                <span class="save-dot" aria-hidden="true"></span><span id="save-text"></span>
              </span>
            </footer>

            <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
              <p>Drop text file to open</p>
            </div>
          </main>
        </div>

        <aside class="oneliner-panel glass" id="oneliner-panel" aria-label="One-Liner converter">
          <div class="panel-head">
            <span class="sidebar-title">One-Liner</span>
            <button
              type="button"
              class="tool col-toggle"
              id="panel-col-toggle"
              title="Collapse one-liner"
              aria-label="Collapse one-liner panel"
            >
              <span class="ic" data-icon="chevronsRight"></span>
            </button>
          </div>

          <section class="ol-pane">
            <label for="ol-input">Paste text</label>
            <textarea id="ol-input" placeholder="Paste your multiline text here…" spellcheck="false"></textarea>
          </section>

          <section class="ol-pane ol-pane-result">
            <label for="ol-output">Result</label>
            <textarea id="ol-output" readonly placeholder="One-liner…"></textarea>
            <button type="button" class="btn btn-quiet" id="ol-copy">
              <span class="ic ic-inline" data-icon="copy"></span>
              Copy result
            </button>
          </section>
        </aside>
      </div>
    </div>

    <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>

    <input type="file" id="file-input" accept=".txt,text/plain" hidden />

    <!-- Confirm dialog -->
    <div class="overlay overlay-confirm" id="confirm-overlay" hidden>
      <section class="modal-confirm glass" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <h2 id="confirm-title">Discard this document?</h2>
        <p id="confirm-message">Your current text will be removed.</p>
        <div class="confirm-actions">
          <button type="button" class="btn btn-quiet" id="confirm-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-ok">Discard</button>
        </div>
      </section>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
